crons:
  - name: imap-poll-watchdog
    description: "Ogni 15 min ri-arma e lancia lo smistamento automatico email IMAP, così non resta mai fermo dopo un riavvio"
    cron: "*/15 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/imap-poll"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: disdette-reminder
    description: "Ogni giorno alle 8:00 avvisa l'agenzia delle disdette da inviare in scadenza (promemoria interno, mai al cliente)"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/disdette-reminder"
    method: POST
    enabled: true
  - name: cloud-archive-sweep
    description: "Ogni 30 min porta su Google Drive tutti i documenti del CRM non ancora archiviati, per ogni agenzia collegata"
    cron: "*/30 * * * *"
    endpoint: "{{BASE_URL}}/api/cron/cloud-archive-sweep"
    method: POST
    enabled: true
